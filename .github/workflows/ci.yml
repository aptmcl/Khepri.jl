name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - 'nightly'
        os:
          - windows-latest
        arch:
          - default
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - name: Use KhepriBase master (dev builds only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: julia --color=yes --project=@. -e 'using Pkg; Pkg.develop(url="https://github.com/aptmcl/KhepriBase.jl")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
  registry-deps:
    name: Registry dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # This job deliberately does NOT Pkg.develop KhepriBase master. Every other
      # job does, which means nothing ever loaded the package against its own
      # declared compat bounds -- the resolution a registry user actually gets.
      # KhepriAutoCAD v1.5.0 failed AutoMerge for exactly that reason: it called
      # KhepriBase.curve_geometry_capabilities, absent from the registered 0.8.0
      # that a bound of "0.8" resolved to, while CI stayed green against master.
      - name: Load with every dependency resolved from the registry
        run: |
          julia --color=yes -e '
            using Pkg
            repo = pwd()
            proj = Pkg.Types.read_project(joinpath(repo, "Project.toml"))
            Pkg.activate(mktempdir())
            Pkg.develop(path = repo)
            for (_, p) in Pkg.dependencies()
              if p.name !== nothing && p.name != proj.name && startswith(p.name, "Khepri")
                @info "resolved" package = p.name version = p.version
              end
            end
            Base.require(Base.PkgId(proj.uuid, proj.name))
            @info "loaded with registry-resolved dependencies"'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Use KhepriBase master (dev builds only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: julia --color=yes --project=@. -e 'using Pkg; Pkg.develop(url="https://github.com/aptmcl/KhepriBase.jl")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
